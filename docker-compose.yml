version: "3.8"

# Запуск:                  docker-compose up -d
# Пересобрать backend:     docker-compose up -d --build backend
# Логи:                    docker-compose logs -f backend
# Ingestion PDF:           docker-compose exec backend python -m backend.rag.ingest_pdf
#
# LLM не в compose. Варианты для LLM_API_URL в .env:
#   vllm/Ollama на хосте:  http://host.docker.internal:8080
#   OpenAI:                https://api.openai.com
#   Другая машина:         http://192.168.1.100:8080
# На Linux вместо host.docker.internal нужно добавить extra_hosts (см. backend секцию)

networks:
  app-net:
    driver: bridge

volumes:
  redis-data:
  qdrant-data:

services:

  # ── Redis ──────────────────────────────────────────────────────────────
  redis:
    image: redis:8.6.3
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    volumes:
      - redis-data:/data
    networks: [app-net]
    # Не открываем наружу — только backend общается с Redis внутри app-net.
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Qdrant ────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [app-net]
    ports:
      - "6333:6333"   # нужен если запускаешь ingest_pdf.py локально вне Docker
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend    # build context = папка backend/
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL:   "redis://redis:6379/0"
      QDRANT_HOST: "qdrant"
      QDRANT_PORT: "6333"
    # Для Linux:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks: [app-net]
    volumes:
      - ./backend:/app/backend
      - ./docs:/app/docs        # PDF файлы для ingestion
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: "http://backend:8000"
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    networks: [app-net]
    volumes:
      - ./frontend:/app